<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PaperPlane</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; color: #9dff9d;
    font-family: system-ui, -apple-system, sans-serif; }
  #preview { display: none; padding: 24px; }
  #preview .frame { width: 576px; height: 288px; border: 1px solid #1d5c1d;
    padding: 24px; box-sizing: border-box; }
  #preview h1 { margin: 0 0 12px; font-size: 34px; letter-spacing: 1px; }
  #preview p { margin: 8px 0; font-size: 18px; }
  #preview .dim { opacity: 0.55; }
  #preview .note { margin-top: 16px; font-size: 13px; opacity: 0.6; }
</style>
</head>
<body>
<div id="preview">
  <div class="frame">
    <h1>PaperPlane</h1>
    <p id="preview-status">Telegram, on your lens.</p>
    <p class="dim">Tap once to link - double-tap for help.</p>
  </div>
  <p class="note">Preview mode - no glasses bridge detected. The same screen is
  drawn on the lens when the bridge is present.</p>
</div>
<script type="module" src="./app.js"></script>
</body>
</html>
